<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- App Icon Background: Authentic Shopee Orange -->
  <rect width="64" height="64" rx="14" fill="#EE4D2D"/>
  
  <!-- Official Shopee Bag Vector Outline & Handle -->
  <g fill="#FFFFFF" transform="translate(12.8, 5) scale(1.6)">
    <!-- Inner Handle Cutout & Outer Bag Contour (from Official Shopee Brand Vector) -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M11.9986 1.4009c-2.068 0-3.7539 1.95-3.8329 4.3899h7.6657c-.08-2.44-1.765-4.3899-3.8328-4.3899zm7.8516 22.5981-.08.001-15.7843-.002c-1.074-.04-1.863-.91-1.971-1.991l-.01-.195L1.298 6.2858a.459.459 0 0 1 .45-.494h4.9748C6.8448 2.568 9.1607 0 11.9996 0c2.8388 0 5.1537 2.5689 5.2757 5.7898h4.9678a.459.459 0 0 1 .458.483l-.773 15.5883-.007.131c-.094 1.094-.979 1.9769-2.0709 2.0059z"/>
  </g>

  <!-- Authentic ShopeeFood Cutout: Fork & Spoon in Shopee Orange -->
  <g fill="#EE4D2D" stroke="#EE4D2D">
    <!-- Fork (Left side) -->
    <path d="M28.2 26.5 L28.2 36" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M26.2 20.8 L26.2 24.8 C26.2 26.3, 30.2 26.3, 30.2 24.8 L30.2 20.8" fill="none" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="28.2" y1="20.8" x2="28.2" y2="25.2" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Spoon (Right side) -->
    <path d="M35.8 26.8 L35.8 36" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="35.8" cy="23.4" rx="2.5" ry="3.4" stroke-width="0"/>
  </g>

  <!-- Official ShopeeFood Typography: Shopee (Regular/Medium) + Food (Bold/Heavy) -->
  <text x="32" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">
    <tspan font-weight="600">Shopee</tspan><tspan font-weight="800">Food</tspan>
